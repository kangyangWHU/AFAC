# 赛题四 全局配置。改算法/调参只改这里，不动代码。

paths:
  raw_root: data/public_dataset_upload/raw
  questions_dir: data/public_dataset_upload/questions/group_a
  doc_index: doc_index.json
  index_dir: processed_vl        # 预处理产物(索引/大纲/身份)统一在此

# LLM（仅 Qwen 系，合规）。本地 gpt-oss 开发用；正式提交切百炼 qwen。
# 本地 gpt-oss: base_url http://localhost:30000/v1  model openai/gpt-oss-120b  api_key EMPTY
# 百炼合规:    base_url https://dashscope.aliyuncs.com/compatible-mode/v1  api_key env:BAILIAN  model qwen3.6-27b
llm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: env:BAILIAN
  model: glm-5.2
  temperature: 0.0
  max_tokens: 3072          # 非thinking ~400/call用不满, 留空间写"答案:"行
  enable_thinking: false    # 默认关; verdict/synth 由 reasoning_effort 单独开思考(judge 不开)
  reasoning_effort: low     # gpt-oss 费token, 降到 low
  seed: 42                  # 固定 seed → 输出确定可复现
  timeout: 300
  retries: 2

# BM25 词法检索(唯一合规召回; 规则禁 embedding/dense/rerank)
bm25:
  tokenizer: jieba           # jieba | char
  k1: 1.5
  b: 0.75
  topk: 8                    # 单 query 返回块数
  drop_stopwords: true
  index_breadcrumb: true     # breadcrumb(章节/条款号)进 BM25 索引词(无embedding下补词面召回); 可关

# 新 parse+chunk(PaddleOCR-VL → 段落块)
vl:
  dpi: 200
  target_chars: 300          # 段落过大时按句聚到此
  max_chars: 400             # 段落超此才切
  bc_levels: 2               # breadcrumb 取最近几级章节
  bc_doc_title: false        # breadcrumb 是否含文档名(doc-scoped检索下冗余, 默认否)
  bc_cap: 24                 # breadcrumb 单段最长字数(超/带句中标点的标题丢弃)

# Agentic RAG。所有可调数值集中在此，代码不留魔法数。
agentic:
  index_variant: "_vl"         # ""=旧索引 / "_vl"=新PaddleOCR-VL索引(bm25_vl.pkl/outlines_vl.json)
  # 分解器：题 -> 子问题
  decompose_max_tokens: 6000   # 推理模型推理吃 token, 给足防 JSON 截断
  decompose_retries: 1         # JSON 不合法时的重试次数
  decompose_cache: false       # 关缓存: 各模型各自 decompose, 缓存会冻结某一版

  # 子问题 loop：检索 + judge（读块吐值/判真）
  loop_max_iter: 1             # 1轮(原3): 省token, 多轮收益小
  loop_batch: 8               # 每轮判块数; 饱和词答案常落第5名, batch=8 才进判题集
  loop_requery: 1             # loop 内重出检索词次数上限
  loop_search_mult: 3         # 每轮 BM25 取 batch*此值, 去重后取前 batch
  loop_window_chars: 500      # 喂 judge 的窗口大小: 以 BM25 命中为中心截窗
  loop_cache_query: true      # 检索词缓存: 同子问题复用 → 可复现+省token
  loop_cache_retrieve: true   # BM25 检索结果缓存: 同(query,候选篇)复用召回块序
  loop_genquery: false        # 默认关同义扩展: 裸 ask 已~95%命中; 扩展易带偏
  loop_genquery_max_tokens: 40
  loop_judge_max_tokens: 700  # 啰嗦模型 400 会把判块JSON截断→found假; 调大
  loop_evidence_chars: 240    # 命中块喂 synthesize 的证据片段长度

  # 事实 -> 文档路由(route.py): 给定 ask, 在候选 doc_ids 里选篇
  route_chunk_k: 30           # 每篇取多少 chunk 聚合打分
  route_min_lead: 1.3         # top 篇领先次高的倍数, 够大才缩到 1 篇
  route_top_k: 2
  # 文档身份路由(idroute.py): ask 唯一字面命中某篇身份→定篇; 否则整组齐检
  route_id_lit_min: 5         # 字面阈: ≥此长公共子串→定篇(滤"保险公司"等泛词)

  # synthesize：原题 + 子问题结论 -> 最终答案(1 次 LLM)
  synth_max_tokens: 2000      # 逐选项详析很长, 太小会把"答案:"行截断
